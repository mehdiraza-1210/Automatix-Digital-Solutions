<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer glowing A frame -->
  <path d="M50 12 L84 78 L68 78 L58 56 L42 56 L32 78 L16 78 Z" stroke="url(#glowGrad)" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" fill="none" filter="url(#neonGlow)"/>
  
  <!-- Inner Circuit Core -->
  <path d="M50 28 L62 52 L38 52 Z" stroke="#00f2fe" stroke-width="3" stroke-linejoin="round" fill="rgba(6, 182, 212, 0.15)"/>
  
  <!-- Circuit Nodes & Connecting Traces -->
  <path d="M35 64 L50 64 L65 64" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="12" r="3.5" fill="#00f2fe" filter="url(#neonGlow)"/>
  <circle cx="35" cy="64" r="3" fill="#00f2fe"/>
  <circle cx="65" cy="64" r="3" fill="#3b82f6"/>
  <circle cx="60" cy="38" r="2.5" fill="#00f2fe"/>
  <circle cx="40" cy="38" r="2.5" fill="#3b82f6"/>
</svg>
